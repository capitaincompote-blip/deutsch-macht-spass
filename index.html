<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Deutsch macht Spaß! – The Complete Beginner's German Course</title>
<style>
:root{
  --bg:#fbf6ee; --ink:#26252e; --muted:#6c6977; --card:#fff; --soft:#f5eedf;
  --nav:#1f2d3a; --nav2:#2a3b4b; --accent:#f0a830; --accent-ink:#7a4b00; --teal:#2f7a72;
  --line:#ebe2d2; --ok:#2f9a5a; --okbg:#e0f3e7; --ko:#d6423b; --kobg:#fbe3e1;
  --der:#2f6fd6; --die:#d6423b; --das:#2f9a5a; --pl:#8a5cc7;
  --r:16px; --shadow:0 2px 0 rgba(0,0,0,.04),0 6px 22px rgba(60,40,10,.06);
}
body.dark{
  --bg:#16191f; --ink:#ece9f2; --muted:#a19dab; --card:#20242c; --soft:#2a2f39;
  --nav:#0f1318; --nav2:#1b2129; --line:#323844; --okbg:#173826; --kobg:#3c1d1b; --accent-ink:#ffcf7a;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background .3s}
button{font-family:inherit}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}

/* NAV */
nav{background:var(--nav);color:#fff;padding:22px 14px 30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 4px}
.brand .flag{width:34px;height:24px;border-radius:5px;background:linear-gradient(#111 33%,#dd0000 33% 66%,#ffce00 66%);flex:none}
.brand h1{font-size:1.18rem;margin:0;line-height:1.2}
.brand-sub{font-size:.8rem;opacity:.65;margin:0 6px 16px}
.navlink{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#e9edf2;padding:8px 10px;border-radius:10px;font-size:.92rem;cursor:pointer;margin-bottom:2px}
.navlink:hover{background:var(--nav2)}
.navlink.active{background:var(--accent);color:#1f2d3a;font-weight:700}
.navlink .num{opacity:.55;font-size:.8rem;width:18px;text-align:right}
.navlink.active .num{opacity:.8}
.navlink .tick{margin-left:auto;font-size:.8rem}
.unit-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.5;margin:16px 10px 6px}
.burger{display:none}

/* MAIN */
main{padding:0 48px 60px;max-width:1020px;width:100%}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.86rem;font-weight:600;white-space:nowrap}
.pill.xp{background:var(--accent);border-color:var(--accent);color:#1f2d3a}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:34px;cursor:pointer;font-size:1rem;color:var(--ink)}
.kicker{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;font-weight:700}
.chapter-head{display:flex;align-items:center;gap:16px;margin:4px 0 8px}
.chapter-head .emoji{font-size:2.8rem;line-height:1}
.chapter-head h2{margin:0;font-size:2rem;line-height:1.15}
.intro{font-size:1.07rem;margin:8px 0 18px}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.goals span{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:.86rem}
.goals span::before{content:"🎯 "}

section.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow)}
section.block > h3{margin:0 0 14px;font-size:1.12rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
section.block > h3 small{font-weight:400;color:var(--muted);font-size:.85rem}
h4{margin:0 0 6px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.de{font-weight:600;font-size:1.04rem}
td.tip{color:var(--muted);font-size:.9rem}
.say{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.85rem;margin-right:8px;vertical-align:middle;flex:none;color:var(--ink)}
.say:hover{background:var(--accent)}
.memo{background:#fff6df;border-left:5px solid var(--accent);border-radius:12px;padding:13px 16px;margin:12px 0}
body.dark .memo{background:#2d2617}
.memo .tag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);display:block;margin-bottom:3px}
.fact{background:linear-gradient(135deg,#e7f3f1,#f2ecfb);border-radius:var(--r);padding:16px 20px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start}
body.dark .fact{background:linear-gradient(135deg,#1c2e2c,#29233a)}
.fact .big{font-size:1.8rem;line-height:1}
.der{color:var(--der);font-weight:700}.die{color:var(--die);font-weight:700}.das{color:var(--das);font-weight:700}.pl{color:var(--pl);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mini{background:var(--soft);border-radius:12px;padding:14px 16px}
.chant{font-family:"Courier New",monospace;font-size:1.12rem;background:var(--nav);color:#ffd58a;padding:10px 16px;border-radius:10px;display:inline-block;margin:6px 6px 6px 0}
.ex{display:flex;align-items:center;gap:4px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .en{color:var(--muted);margin-left:auto;padding-left:14px;text-align:right;font-size:.92rem}
.hl{background:#ffe7a8;border-radius:4px;padding:0 3px}
body.dark .hl{background:#6a5016}
.bubble{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.bubble .who{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.85rem}
.bubble .txt{background:var(--soft);border-radius:14px;padding:8px 13px;max-width:80%}
.bubble.r{flex-direction:row-reverse}
.bubble.r .txt{background:#e5effc}
body.dark .bubble.r .txt{background:#1f2c40}
.bubble .en{display:block;font-size:.83rem;color:var(--muted)}
.bubble .en.hide{filter:blur(5px);cursor:pointer}

/* Practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:.9rem;font-weight:600}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.flip{perspective:800px;height:112px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;backface-visibility:hidden;font-weight:600}
.front{background:var(--nav);color:#fff;font-size:1.06rem}
.back{background:var(--accent);color:#1f2d3a;transform:rotateY(180deg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;font-size:.95rem;min-height:46px}
.match button.sel{border-color:var(--accent);background:#fff3d6}
body.dark .match button.sel{background:#3a2f16}
.match button.done{background:var(--okbg);border-color:var(--ok);opacity:.55;cursor:default}
.match button.shake{animation:shake .35s;border-color:var(--ko)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.listen-play{font-size:1.4rem;width:70px;height:70px;border-radius:50%;border:0;background:var(--teal);color:#fff;cursor:pointer;display:block;margin:6px auto 16px;box-shadow:0 4px 0 #1d524c}
.listen-play:active{transform:translateY(2px);box-shadow:0 2px 0 #1d524c}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.lopts button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.95rem}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lopts button{border-radius:12px}
.opts button:hover,.lopts button:hover{border-color:var(--accent)}
button.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
button.ko{background:var(--kobg)!important;border-color:var(--ko)!important}
.quiz-q{margin-bottom:18px}
.quiz-q p{margin:0 0 8px;font-weight:600}
.feedback{font-size:.9rem;margin-top:6px;min-height:1.2em}
.score{font-weight:700;font-size:1.05rem;margin-top:10px}
.umlauts{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.umlauts button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;width:36px;height:34px;cursor:pointer;font-size:1rem;font-weight:700}
.type-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
.type-row label{flex:1 1 280px}
.type-row input{border:2px solid var(--line);border-radius:10px;padding:8px 11px;font-size:1rem;width:170px;background:var(--card);color:var(--ink)}
.type-row input.ok{border-color:var(--ok);background:var(--okbg)}
.type-row input.ko{border-color:var(--ko)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:.92rem;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.big{padding:12px 22px;font-size:1rem}
.tfb{font-size:.88rem;min-width:120px}
.navbtns{display:flex;justify-content:space-between;margin-top:10px;gap:10px}

/* Dashboard & review */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem}
.stat span{font-size:.8rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.badge{text-align:center;padding:14px 8px;border-radius:14px;background:var(--soft);font-size:.8rem;cursor:pointer}
.badge .e{font-size:2rem;display:block}
.badge.off{filter:grayscale(1);opacity:.4}
.lvlbar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0 4px}
.lvlbar div{height:100%;background:linear-gradient(90deg,var(--accent),#f6c86a);transition:width .5s}
.bigcard{max-width:440px;margin:10px auto;height:200px;perspective:900px;cursor:pointer}
.bigcard .face{font-size:1.5rem;border-radius:20px}
.boxes{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.boxes span{background:var(--soft);border-radius:10px;padding:6px 12px;font-size:.82rem}

/* Memory Book cards */
.mbcards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.mbcard{height:128px}
.mbcard .face{flex-direction:column}
.front .der{color:#7fb0ff}.front .die{color:#ff8a83}.front .das{color:#6fd39a}.front .pl{color:#c7a4ff}
.mb-de{font-size:1.08rem;line-height:1.3}
.mb-en{font-size:1rem;line-height:1.3}
.mb-note{font-size:.78rem;font-weight:500;margin-top:6px;opacity:.85}
.mb-say{margin:8px 0 0!important;background:rgba(255,255,255,.14)!important;color:#fff!important;width:28px!important;height:28px!important}
.back .mb-say{background:rgba(0,0,0,.1)!important;color:#1f2d3a!important}
.pre{color:var(--accent);font-weight:800}
.back .pre{color:#a14f00}
/* My words */
.myform{display:grid;grid-template-columns:1.3fr 1.3fr 1.2fr .8fr auto;gap:8px}
.myform input,.myform select,#my-bulk{border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-size:1rem;background:var(--card);color:var(--ink);font-family:inherit;min-width:0}
.myform input:focus,#my-bulk:focus{outline:none;border-color:var(--accent)}
#my-bulk{width:100%;resize:vertical}
.mydetails{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 14px}
.mydetails summary{cursor:pointer;font-weight:600}
.mysec{border:2px dashed var(--accent)}
.mbcard{position:relative}
.myact{position:absolute;top:6px;z-index:3;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:.75rem;line-height:1}
.mydel{right:6px}.myedit{left:6px}
.mydel:hover{background:var(--ko)}.myedit:hover{background:var(--teal)}
.mbcard.on .myact{display:none}
.mycath{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.mycath small{background:var(--soft);border-radius:999px;padding:1px 8px;font-weight:600;color:var(--muted)}
.mini-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:.8rem;cursor:pointer}
.mycats{margin:4px 0 0}
#toast{position:fixed;right:22px;bottom:22px;background:var(--accent);color:#1f2d3a;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:none}
.confetti{position:fixed;top:-40px;font-size:1.6rem;z-index:60;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.layout > main{min-width:0}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .topbar{flex-wrap:nowrap;gap:6px;padding:10px 0;margin-bottom:18px}
  .topbar .pill{padding:4px 9px;font-size:.78rem}
  .topbar .iconbtn{width:32px;height:30px;font-size:.9rem;flex:none}
  #lvl{display:none}
  section.block{padding:16px 14px}
  section.block table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  td,th{padding:8px 7px}
  td.de{white-space:normal}
  .chapter-head h2{font-size:1.55rem}
  .chapter-head .emoji{font-size:2.2rem}
  .goals span{max-width:100%}
  .mbtools{position:static!important}
  .mbcards{grid-template-columns:1fr 1fr}
  .mbcard{height:118px}
  .mb-de{font-size:.98rem}
  .cards{grid-template-columns:1fr 1fr}
  .bigcard{height:170px}
  .navbtns .btn{flex:1}
  .myform{grid-template-columns:1fr!important}
  nav{position:fixed;inset:0 auto 0 0;width:285px;z-index:40;transform:translateX(-100%);transition:transform .3s}
  nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .burger{display:block;margin-right:auto}
  main{padding:0 16px 50px}
  .grid2,.grid3,.lopts{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .ex{flex-wrap:wrap}.ex .en{margin-left:38px;text-align:left;padding-left:0}
}
@media print{nav,.topbar,.navbtns,.say,.noprint{display:none!important}.layout{display:block}main{max-width:none;padding:0}section.block{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav">
    <div class="brand"><div class="flag"></div><h1>Deutsch macht Spaß!</h1></div>
    <div class="brand-sub">The playful beginner's course · A1</div>
    <div id="menu"></div>
  </nav>
  <main>
    <div class="topbar">
      <button class="iconbtn burger" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
      <span class="pill" id="lvl"></span>
      <span class="pill xp" id="xp"></span>
      <span class="pill" id="streak"></span>
      <button class="iconbtn" title="Slower / normal audio" id="speedBtn" onclick="toggleSpeed()">🐢</button>
      <button class="iconbtn" title="Dark mode" onclick="toggleDark()">🌙</button>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   COURSE CONTENT
   vocab rows: [german, english, tip, (optional) text to speak]
   ========================================================= */
const UNITS = [
  {name:"Unit 1 · First steps", from:0},
  {name:"Unit 2 · Building blocks", from:4},
  {name:"Unit 3 · Your world", from:9},
  {name:"Unit 4 · Getting things done", from:13},
  {name:"Finish line", from:17}
];

const chapters = [
/* ---------------------------------------------------- 0 */
{
  id:"welcome", emoji:"👋", title:"Welcome to German",
  goals:["Know how the course works","Discover words you already know","Learn the 3 golden habits"],
  intro:"Willkommen! (Welcome!) This course takes you from zero to simple everyday conversations: introducing yourself, counting, ordering a coffee, talking about your family and your hobbies. Every chapter is short, visual and full of little games.",
  html:`
  <section class="block"><h3>🧭 How each chapter works</h3>
    <div class="grid3">
      <div class="mini"><h4>📚 Learn</h4>Vocabulary with audio 🔊, grammar in small bites, and a mini dialogue.</div>
      <div class="mini"><h4>🧠 Remember</h4>Yellow <b>memory hooks</b>: silly images, rhymes and chants that make words stick.</div>
      <div class="mini"><h4>🎮 Practise</h4>Flashcards, a matching game, a listening game, typing practice, then a quiz.</div>
    </div>
    <p style="margin-top:14px">Pass a quiz with <b>75% or more</b> and you earn the chapter's badge 🏅. Every right answer gives you <b>XP</b>, and studying on consecutive days builds your <b>streak 🔥</b>. Your progress is saved in this browser.</p>
  </section>
  <section class="block"><h3>🎁 Surprise: you already know some German</h3>
    <p>English and German are close cousins (both are Germanic languages). Click the cards:</p>
    <div class="cards" data-cards='[["das Haus","house"],["der Finger","finger"],["die Hand","hand"],["das Wasser","water"],["der Name","name"],["das Buch","book"],["die Musik","music"],["der Garten","garden"],["die Maus","mouse"],["der Ball","ball"]]'></div>
    <div class="memo"><span class="tag">Memory hook · The secret code</span>Many sounds shifted between the two languages. Learn the code and you can guess hundreds of words:<br>
    German <b>d</b> ↔ English <b>th</b>: <i>danken → thank, das → that, drei → three</i><br>
    German <b>t</b> ↔ English <b>d</b>: <i>trinken → drink, Tag → day, gut → good</i><br>
    German <b>pf</b> ↔ English <b>p</b>: <i>Pfeffer → pepper, Apfel → apple</i><br>
    German <b>z</b> ↔ English <b>t</b>: <i>zehn → ten, Zunge → tongue</i></div>
  </section>
  <section class="block"><h3>⭐ The 3 golden habits</h3>
    <ol>
      <li><b>Speak out loud.</b> Press 🔊, repeat, exaggerate. Your mouth needs practice too. (Tip: the 🐢 button at the top slows the voice down.)</li>
      <li><b>Learn nouns with their article</b> (der / die / das). Always. You'll see why in Chapter 5.</li>
      <li><b>Little and often.</b> Ten minutes a day beats two hours on Sunday. Use the 🃏 <b>Review deck</b> to revise all the cards at once.</li>
    </ol>
  </section>`,
  fact:"German is the most widely spoken native language in the European Union, and it's an official language in Germany, Austria, Switzerland, Liechtenstein, Luxembourg and Belgium.",
  quiz:[
    {q:"Using the secret code, <i>das Bett</i> probably means…", o:["the bed","the bet","the bath"], a:0},
    {q:"<i>trinken</i> probably means…", o:["to drink","to think","to train"], a:0},
    {q:"<i>der Apfel</i> is…", o:["the apple","the April","the ape"], a:0},
    {q:"What should you always learn with a noun?", o:["its article (der/die/das)","its plural only","its spelling backwards"], a:0}
  ]
},
/* ---------------------------------------------------- 1 */
{
  id:"sounds", emoji:"🔤", title:"Sounds & Letters",
  goals:["Read any German word aloud","Master ei / ie","Pronounce ä, ö, ü and ß"],
  intro:"German is a very honest language: you mostly say what you see. Learn these rules once and you can pronounce almost any word, even ones you don't understand yet.",
  vocabHead:["Letter / rule","Example","Sounds like"],
  vocab:[
    ["W = English v","Wasser (water)","“VAH-ser”","Wasser"],
    ["V = English f","Vater (father)","“FAH-ter”","Vater"],
    ["J = English y","ja (yes)","“yah”","ja"],
    ["Z = ts","Zeit (time)","“tsite”","Zeit"],
    ["S before a vowel = z","Sonne (sun)","“ZON-neh”","Sonne"],
    ["ß = ss","Straße (street)","“SHTRAH-sseh”","Straße"],
    ["ei = “eye”","Wein (wine), drei","“vine”, “dry”","Wein. drei"],

{
  id:"articles", emoji:"🎨", title:"der, die, das",
  goals:["Understand the 3 genders","Use ending clues to guess the gender","Use ein / eine"],
  intro:"Every German noun has a gender: masculine (<span class='der'>der</span>), feminine (<span class='die'>die</span>) or neuter (<span class='das'>das</span>). It's often not logical (a girl is neuter!), so we use colours and clever clues.",
  html:`
  <section class="block"><h3>🌈 The colour code</h3>
    <div class="grid2">
      <div class="mini"><h4 class="der">der · masculine · blue</h4>der Mann (man), der Tisch (table), der Hund (dog), der Montag</div>
      <div class="mini"><h4 class="die">die · feminine · red</h4>die Frau (woman), die Katze (cat), die Zeitung, die Freiheit</div>
      <div class="mini"><h4 class="das">das · neuter · green</h4>das Kind (child), das Haus, das Auto, das Mädchen (girl!)</div>
      <div class="mini"><h4 class="pl">die · plural · purple</h4>ALL plurals use <b>die</b>: die Männer, die Kinder, die Häuser</div>
    </div>
    <div class="memo"><span class="tag">Golden rule</span>Never learn a noun on its own. Learn it with its article, like a <b>first name and surname</b>: not “Tisch” but “<span class="der">der</span> Tisch”. In your notebook, write it in its colour. Your visual memory will do the rest.</div>
    <div class="memo"><span class="tag">Memory hook · Picture it</span>Imagine every <span class="der">der</span> noun is <b>freezing in blue ice</b> 🧊, every <span class="die">die</span> noun is <b>on fire</b> 🔥, every <span class="das">das</span> noun is <b>covered in grass</b> 🌿. A burning cat, a frozen table, a grassy house: you won't forget.</div>
  </section>
  <section class="block"><h3>🔍 Endings that give the game away</h3>
    <table><tr><th>Ending / group</th><th>Gender</th><th>Examples</th></tr>
      <tr><td class="de">-ung, -heit, -keit, -schaft, -ion, -tät</td><td class="die">die (100%)</td><td>die Wohnung, die Freiheit, die Nation, die Universität</td></tr>
      <tr><td class="de">-chen, -lein (small things)</td><td class="das">das (100%)</td><td>das Mädchen, das Brötchen, das Kätzchen</td></tr>
      <tr><td class="de">-e (most of the time)</td><td class="die">die</td><td>die Katze, die Lampe, die Schule</td></tr>
      <tr><td class="de">-um, -ment, -o</td><td class="das">das</td><td>das Museum, das Instrument, das Auto</td></tr>
      <tr><td class="de">days, months, seasons</td><td class="der">der</td><td>der Montag, der Mai, der Winter</td></tr>
      <tr><td class="de">-er (people, tools), -ismus</td><td class="der">der</td><td>der Lehrer, der Computer, der Tourismus</td></tr>
    </table>
    <div class="memo"><span class="tag">Memory hook</span><b>-chen makes things tiny and cute</b>, and tiny cute things lose their gender: <i>das Mädchen</i> (little maiden), <i>das Kätzchen</i> (kitten). Picture a tiny green baby 👶🌿.</div>
    <div class="memo"><span class="tag">Memory hook</span>The feminine endings in one silly sentence: “<b>Hung</b>ry <b>Heid</b>i's <b>Kei</b>th <b>shaft</b>ed the l<b>ion</b>” → -ung, -heit, -keit, -schaft, -ion. 🦁</div>
  </section>
  <section class="block"><h3>✋ “a / an”: ein & eine</h3>
    <div class="grid3">
      <div class="mini"><span class="der">der</span> Mann → <span class="der">ein</span> Mann</div>
      <div class="mini"><span class="die">die</span> Frau → <span class="die">eine</span> Frau</div>
      <div class="mini"><span class="das">das</span> Kind → <span class="das">ein</span> Kind</div>
    </div>
    <div class="memo"><span class="tag">Memory hook</span>The feminine one keeps her <b>-e</b>: <span class="die">di<b>e</b></span> ends in e, so <span class="die">ein<b>e</b></span> does too. Masculine and neuter share the short <i>ein</i>.</div>
  </section>`,

    ["der Mann","man",""],["die Frau","woman",""],["das Kind","child",""],["der Tisch","table",""],
    ["der Stuhl","chair",""],["die Lampe","lamp","-e → die"],["das Buch","book",""],["das Auto","car","-o → das"],
    ["die Tür","door",""],["das Fenster","window",""],["der Hund","dog",""],["die Katze","cat","-e → die"],
    ["die Zeitung","newspaper","-ung → die"],["das Mädchen","girl","-chen → das"],["der Computer","computer","-er → der"],["die Stadt","city / town",""],

{
  id:"accusative", emoji:"🎯", title:"The target: accusative",
  goals:["Recognise the subject and the object","Change der → den, ein → einen","Use mich, dich, ihn…"],
  intro:"When you <i>see a dog</i>, <i>buy a coffee</i> or <i>have a brother</i>, that thing is the <b>target</b> of the action (the direct object). In German, the target can change its article. But don't panic: <b>only the masculine changes</b>!",
  html:`
  <section class="block"><h3>🎯 Only der changes</h3>
    <table><tr><th></th><th class="der">masculine</th><th class="die">feminine</th><th class="das">neuter</th><th class="pl">plural</th></tr>
      <tr><td><b>Subject</b> (who does it)</td><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr>
      <tr><td><b>Target</b> (accusative)</td><td><span class="hl">den / einen</span></td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr>
    </table>
    <div class="ex"><button class="say" data-say="Der Hund sieht den Mann.">🔊</button><span class="der">Der</span> Hund sieht <span class="hl">den</span> Mann.<span class="en">The dog sees the man.</span></div>
    <div class="ex"><button class="say" data-say="Der Mann sieht den Hund.">🔊</button><span class="der">Der</span> Mann sieht <span class="hl">den</span> Hund.<span class="en">The man sees the dog.</span></div>
    <div class="ex"><button class="say" data-say="Ich habe einen Bruder und eine Schwester.">🔊</button>Ich habe <span class="hl">einen</span> Bruder und eine Schwester.<span class="en">I have a brother and a sister.</span></div>
    <div class="ex"><button class="say" data-say="Ich kaufe den Tisch.">🔊</button>Ich kaufe <span class="hl">den</span> Tisch.<span class="en">I'm buying the table.</span></div>
    <div class="ex"><button class="say" data-say="Es gibt keinen Kaffee.">🔊</button>Es gibt <span class="hl">keinen</span> Kaffee.<span class="en">There's no coffee.</span></div>
    <div class="memo"><span class="tag">Memory hook · The archery target</span>When a masculine word becomes the <b>target</b> 🎯, the arrow leaves a mark: an <b>N</b>. der → de<b>n</b>, ein → ein<b>en</b>, kein → kein<b>en</b>, mein → mein<b>en</b>. Women, things and groups are bulletproof 🛡️: nothing changes.</div>
    <div class="memo"><span class="tag">Bonus</span>Because of these endings, German can shuffle word order: <i><span class="hl">Den</span> Mann sieht der Hund</i> still means the <b>dog</b> sees the man! The article tells you who's the target.</div>
  </section>
  <section class="block"><h3>👉 me, you, him… as targets</h3>
    <table><tr><th>Subject</th><th>Target</th><th>Example</th></tr>
      <tr><td>ich</td><td><b>mich</b></td><td>Er liebt mich. (He loves me.)</td></tr>
      <tr><td>du</td><td><b>dich</b></td><td>Ich sehe dich. (I see you.)</td></tr>
      <tr><td>er</td><td><b>ihn</b></td><td>Ich kenne ihn. (I know him.)</td></tr>
      <tr><td>sie / es</td><td><b>sie / es</b></td><td>Ich mag sie. (I like her.)</td></tr>
      <tr><td>wir</td><td><b>uns</b></td><td>Sie besucht uns. (She visits us.)</td></tr>
      <tr><td>ihr</td><td><b>euch</b></td><td>Wir hören euch. (We hear you.)</td></tr>
      <tr><td>sie / Sie</td><td><b>sie / Sie</b></td><td>Ich frage Sie. (I'm asking you.)</td></tr>
    </table>
    <div class="memo"><span class="tag">Memory hook</span><b>ihn ≈ him</b> (just drop the m and shuffle). And again, only “he” changes a lot: <b>er → ihn</b>, same as <b>der → den</b>. The masculine is the drama queen of German grammar 👑.</div>
  </section>`,
  vocab:[
    ["sehen","to see","+ target"],["haben","to have","+ target"],["kaufen","to buy",""],["brauchen","to need",""],
    ["suchen","to look for",""],["finden","to find",""],["kennen","to know (a person / place)",""],["lieben","to love",""],
    ["besuchen","to visit",""],["es gibt","there is / there are","Es gibt einen Park."],["der Kaffee","coffee",""],["der Park","park",""]
  ],

  html:`

    <div class="ex"><button class="say" data-say="Ich möchte einen Kaffee, bitte.">🔊</button>Ich möchte <span class="hl">einen</span> Kaffee, bitte.<span class="en">der Kaffee → einen</span></div>

    <div class="ex"><button class="say" data-say="Ich möchte ein Stück Kuchen.">🔊</button>Ich möchte <span class="hl">ein</span> Stück Kuchen.<span class="en">das Stück → ein</span></div>
    <div class="ex"><button class="say" data-say="Zwei Bier, bitte!">🔊</button>Zwei Bier, bitte!<span class="en">Drinks: no plural needed when ordering</span></div>
    <div class="memo"><span class="tag">Memory hook</span><b>möchte = “would like”</b>: it sounds like “<b>Mmm</b>-ochte” 😋, the sound you make looking at cake. Conjugation: ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, sie möchten.</div>

{
  id:"modals", emoji:"🛠️", title:"Can, must, want: modal verbs",
  goals:["Use können, müssen, wollen","Build the verb sandwich","Avoid the will-trap"],
  intro:"Modal verbs add a mood to your sentence: <b>können</b> (can), <b>müssen</b> (must), <b>wollen</b> (want). They come with a special word order: the verb sandwich 🥪.",
  html:`
  <section class="block"><h3>📊 The three modals</h3>
    <table><tr><th></th><th>können · can</th><th>müssen · must</th><th>wollen · want</th></tr>
      <tr><td>ich</td><td><b>kann</b></td><td><b>muss</b></td><td><b>will</b></td></tr>
      <tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td></tr>
      <tr><td>er/sie/es</td><td><b>kann</b></td><td><b>muss</b></td><td><b>will</b></td></tr>
      <tr><td>wir</td><td>können</td><td>müssen</td><td>wollen</td></tr>
      <tr><td>ihr</td><td>könnt</td><td>müsst</td><td>wollt</td></tr>
      <tr><td>sie/Sie</td><td>können</td><td>müssen</td><td>wollen</td></tr>
    </table>
    <div class="memo"><span class="tag">Memory hook · The twins</span>With modals, <b>ich and er are identical twins</b> 👯: <i>ich kann – er kann</i>, <i>ich muss – er muss</i>. No -t for er! (You already saw this with <i>ich mag – er mag</i>.)</div>
    <div class="memo"><span class="tag">⚠️ False friend</span><b>Ich will</b> does NOT mean “I will”. It means “I <b>want</b>”. <i>Ich will Pizza</i> = I want pizza 🍕. Think: “where there's a <b>will</b>, there's a way”: will = desire.</div>
  </section>
  <section class="block"><h3>🥪 The verb sandwich</h3>
    <p>The modal goes in <b>position 2</b> (conjugated). The main verb goes to the <b>very end</b>, in its dictionary form.</p>
    <div class="ex"><button class="say" data-say="Ich kann gut schwimmen.">🔊</button>Ich <span class="hl">kann</span> gut <span class="hl">schwimmen</span>.<span class="en">I can swim well.</span></div>
    <div class="ex"><button class="say" data-say="Du musst heute arbeiten.">🔊</button>Du <span class="hl">musst</span> heute <span class="hl">arbeiten</span>.<span class="en">You have to work today.</span></div>
    <div class="ex"><button class="say" data-say="Wir wollen nach Berlin fahren.">🔊</button>Wir <span class="hl">wollen</span> nach Berlin <span class="hl">fahren</span>.<span class="en">We want to go to Berlin.</span></div>
    <div class="ex"><button class="say" data-say="Kannst du mir helfen?">🔊</button><span class="hl">Kannst</span> du mir <span class="hl">helfen</span>?<span class="en">Can you help me?</span></div>
    <div class="ex"><button class="say" data-say="Ich kann heute nicht kommen.">🔊</button>Ich <span class="hl">kann</span> heute nicht <span class="hl">kommen</span>.<span class="en">I can't come today.</span></div>
    <div class="memo"><span class="tag">Memory hook</span>The modal and the main verb are the two slices of <b>bread</b> 🍞; everything else is the <b>filling</b> 🥬🧀. <i>Ich <b>kann</b> [heute leider nicht] <b>kommen</b>.</i> Bigger sandwich, same bread.</div>
  </section>`,

/* =========================================================
   STATE (saved in this browser)
   ========================================================= */
const KEY = "deutsch_macht_spass_v2";
const S = (()=>{ const d={done:{},xp:0,streak:0,last:"",boxes:{},seen:{},dark:false,slow:false};
  try{ Object.assign(d, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){} return d; })();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const LEVELS=["Anfänger 🐣","Lehrling 🌱","Entdecker 🧭","Kenner 🦉","Profi 🚀","Meister 👑"];
const XP_PER_LEVEL=200;
const levelOf = xp => Math.min(Math.floor(xp/XP_PER_LEVEL), LEVELS.length-1);
function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function yesterday(){ const d=new Date(Date.now()-864e5); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function touchStreak(){ const t=today(); if(S.last===t) return; S.streak = (S.last===yesterday()) ? S.streak+1 : 1; S.last=t; }
function addXP(n){
  const before = levelOf(S.xp);
  S.xp += n; touchStreak(); save(); toast("+"+n+" XP"); updateTop();
  if(levelOf(S.xp) > before){ setTimeout(()=>{ toast("Level up! "+LEVELS[levelOf(S.xp)]); confetti(); }, 900); }
}
function updateTop(){
  document.getElementById("lvl").textContent = LEVELS[levelOf(S.xp)];
  document.getElementById("xp").textContent = "⭐ "+S.xp+" XP";
  const live = S.last===today() || S.last===yesterday();
  document.getElementById("streak").textContent = "🔥 "+(live?S.streak:0)+" day"+((live?S.streak:0)===1?"":"s");
  document.getElementById("speedBtn").textContent = S.slow ? "🐢" : "🐇";
  document.getElementById("speedBtn").title = S.slow ? "Audio: slow (click for normal)" : "Audio: normal (click for slow)";
}
function toggleDark(){ S.dark=!S.dark; document.body.classList.toggle("dark",S.dark); save(); }
function toggleSpeed(){ S.slow=!S.slow; save(); updateTop(); toast(S.slow?"🐢 Slow audio":"🐇 Normal audio"); }

/* =========================================================
   HELPERS
   ========================================================= */
const strip = s => String(s).replace(/<[^>]+>/g,"");
const esc = s => strip(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function colorArt(de, en){
  const m = String(de).match(/^(der|die|das)\s/);
  if(!m) return de;
  const cls = /\(pl/.test(en||"") ? "pl" : m[1];
  return de.replace(/\b(der|die|das)\b/g, a=>`<span class="${/\(pl/.test(en||"")?"pl":a}">${a}</span>`);
}
function sayText(row){ return row[3] || strip(row[0]).replace(/…|\.\.\./g,"").replace(/\|/g,"").replace(/\s*\+\s*(Dativ|Akkusativ)/g,"").replace(/\s*(\/|↔|=)\s*/g,", ").trim(); }
let tTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove("on"),1500); }
function confetti(){ const em=["🎉","⭐","🥨","🇩🇪","✨","🏅"]; for(let i=0;i<34;i++){ const s=document.createElement("span"); s.className="confetti"; s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDelay=(Math.random()*.6)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3000);} }

/* Speech */
let deVoice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); deVoice = vs.find(v=>/de[-_]DE/i.test(v.lang)&&/google|natural|neural/i.test(v.name)) || vs.find(v=>/^de/i.test(v.lang)) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!("speechSynthesis" in window)){ toast("Audio not supported in this browser"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate = S.slow?0.65:0.9; if(deVoice) u.voice=deVoice;
  speechSynthesis.speak(u);
}

let page = "dash";   // "dash" | "review" | chapter index
function renderMenu(){
  let h = `<button class="navlink ${page==='dash'?'active':''}" onclick="go('dash')"><span>🏆</span><span>My progress</span></button>
           <button class="navlink ${page==='review'?'active':''}" onclick="go('review')"><span>🃏</span><span>Review deck</span></button>
           <button class="navlink ${page==='memory'?'active':''}" onclick="go('memory')"><span>📒</span><span>Memory Book</span><span class="tick" style="opacity:.6">${mbCount()}</span></button>`;
  chapters.forEach((c,i)=>{
    const u = UNITS.find(u=>u.from===i); if(u) h += `<div class="unit-label">${u.name}</div>`;
    h += `<button class="navlink ${page===i?'active':''}" onclick="go(${i})"><span class="num">${i}</span><span>${c.emoji}</span><span>${c.title}</span><span class="tick">${S.done[c.id]?'🏅':''}</span></button>`;
  });
  document.getElementById("menu").innerHTML = h;
}
function go(p){ if(typeof p==="number" && (p<0||p>=chapters.length)) return; page=p; document.getElementById("nav").classList.remove("open"); render(); }

/* =========================================================
   PAGE RENDERING
   ========================================================= */
function render(){
  const main = document.getElementById("content");
  if(page==="dash") main.innerHTML = dashHTML();
  else if(page==="review") main.innerHTML = reviewHTML();
  else if(page==="memory") main.innerHTML = memoryHTML();
  else main.innerHTML = chapterHTML(page);
  main.querySelectorAll("[data-cards]").forEach(el=>{ el.outerHTML = cardsHTML(JSON.parse(el.dataset.cards)); });
  if(typeof page==="number"){
    const c = chapters[page];
    if(c.final) newExam();
    if(!S.seen[c.id]){ S.seen[c.id]=1; touchStreak(); save(); }
  }
  if(page==="review") nextReview();
  renderMenu(); updateTop();
  window.scrollTo({top:0});
}

function chapterHTML(i){
  const c = chapters[i];
  let h = `<div class="kicker">Chapter ${i} · ${UNITS.filter(u=>u.from<=i).pop().name}</div>
    <div class="chapter-head"><span class="emoji">${c.emoji}</span><h2>${c.title}</h2></div>
    <p class="intro">${c.intro}</p>`;
  if(c.goals) h += `<div class="goals">${c.goals.map(g=>`<span>${g}</span>`).join("")}</div>`;
  if(c.html) h += c.html;
  if(c.vocab){
    const hd = c.vocabHead || ["German","English","Tip"];
    h += `<section class="block"><h3>📚 ${c.vocabHead?"The rules":"Vocabulary"} <small>(press 🔊 and repeat out loud)</small></h3><table>
      <tr><th>${hd[0]}</th><th>${hd[1]}</th><th>${hd[2]}</th></tr>
      ${c.vocab.map(r=>`<tr><td class="de"><button class="say" data-say="${esc(sayText(r))}">🔊</button>${colorArt(r[0],r[1])}</td><td>${r[1]}</td><td class="tip">${r[2]}</td></tr>`).join("")}
    </table></section>`;
  }
  if(c.memos) h += `<section class="block"><h3>🧠 Memory hooks</h3>${c.memos.map(m=>`<div class="memo">${m}</div>`).join("")}</section>`;
  if(c.dialogue){
    const people=[...new Set(c.dialogue.map(d=>d[0]))], cols=["#2f7a72","#d6423b"];
    h += `<section class="block"><h3>🎭 Mini dialogue <button class="say" data-say="${esc(c.dialogue.map(d=>d[1]).join(' '))}">🔊</button><small>English is blurred: click to reveal it</small></h3>
      ${c.dialogue.map(([who,de,en])=>{const k=people.indexOf(who);return `<div class="bubble ${k%2?'r':''}"><div class="who" style="background:${cols[k%2]}">${who.slice(0,3)}</div><div class="txt"><button class="say" data-say="${esc(de)}">🔊</button>${de}<span class="en hide" onclick="this.classList.remove('hide')">${en}</span></div></div>`}).join("")}
    </section>`;
  }
  if(c.fact) h += `<div class="fact"><span class="big">💡</span><div><b>Did you know?</b><br>${c.fact}</div></div>`;
  if(c.final){
    h += `<section class="block"><h3>🎓 Final exam</h3><div id="exam"></div>
      <p><button class="btn" onclick="newExam()">🔄 New exam</button></p></section>`;
  }
  // Practice zone
  const tabs=[];
  if(c.cards) tabs.push(["cards","🃏 Flashcards"]);
  if(c.vocab && !c.noMatch) tabs.push(["match","🧩 Match"]);
  if(c.vocab && !c.noListen) tabs.push(["listen","👂 Listen"]);
  if(c.type) tabs.push(["type","⌨️ Type it"]);
  if(tabs.length){
    h += `<section class="block"><h3>🎮 Practice zone</h3>
      <div class="tabs">${tabs.map((t,k)=>`<button class="${k?'':'on'}" onclick="showTab(this,'${t[0]}')">${t[1]}</button>`).join("")}</div>
      <div id="tab-cards" class="tabpane" ${tabs[0][0]==='cards'?'':'hidden'}>${c.cards?cardsHTML(c.cards):''}</div>
      <div id="tab-match" class="tabpane" ${tabs[0][0]==='match'?'':'hidden'}></div>
      <div id="tab-listen" class="tabpane" hidden></div>
      <div id="tab-type" class="tabpane" ${tabs[0][0]==='type'?'':'hidden'}>${c.type?typeHTML(c.type):''}</div>
    </section>`;
  }
  if(c.quiz){
    h += `<section class="block"><h3>🎯 Chapter quiz <small>${S.done[c.id]?'🏅 badge earned!':'score 75% to earn the badge'}</small></h3><div id="quizbox">${quizHTML(c.quiz, c.id)}</div></section>`;
  }
  h += `<div class="navbtns">
    <button class="btn alt big" onclick="go(${i-1})" ${i===0?'disabled style="opacity:.3"':''}>← Previous</button>
    <button class="btn big" onclick="go(${i+1})" ${i===chapters.length-1?'disabled style="opacity:.3"':''}>Next →</button></div>`;
  return h;
}

function showTab(btn, name){
  btn.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
  document.querySelectorAll(".tabpane").forEach(p=>p.hidden=true);
  const pane=document.getElementById("tab-"+name); pane.hidden=false;
  if(name==="match" && !pane.innerHTML) newMatch();
  if(name==="listen" && !pane.innerHTML) newListen();
}

/* ---------- Flashcards ---------- */
function cardsHTML(list){
  return `<div class="cards">${list.map(([f,b])=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="flip-inner"><div class="face front"><div>${colorArt(f)}</div></div><div class="face back"><div>${b}</div></div></div></div>`).join("")}</div>`;
}

/* ---------- Quiz ---------- */
const QZ = {};
function quizHTML(qs, key){
  const prepared = qs.map(q=>{ const idx=shuffle(q.o.map((_,k)=>k)); return {...q, o:idx.map(k=>q.o[k]), a:idx.indexOf(q.a)}; });
  QZ[key] = {qs:prepared, ans:{}};
  return prepared.map((q,i)=>`<div class="quiz-q"><p>${i+1}. ${q.q}</p>
    <div class="opts">${q.o.map((o,j)=>`<button onclick="answer('${key}',${i},${j},this)">${o}</button>`).join("")}</div>
    <div class="feedback"></div></div>`).join("") + `<div class="score" id="score-${key}"></div>`;
}
const CHEERS=["Super! 🎉","Toll! ⭐","Sehr gut! 👏","Prima! 🚀","Genau! ✅","Klasse! 🥨","Wunderbar! 🌟"];
function answer(key, i, j, btn){
  const st=QZ[key], q=st.qs[i];
  if(st.ans[i]!==undefined) return;
  const ok = j===q.a; st.ans[i]=ok;
  const box=btn.closest(".quiz-q");
  box.querySelectorAll("button")[q.a].classList.add("ok");
  if(!ok) btn.classList.add("ko");
  box.querySelector(".feedback").innerHTML = (ok ? CHEERS[Math.floor(Math.random()*CHEERS.length)] : "Nicht ganz… (not quite): the green one is right.") + (q.note?` <i>${q.note}</i>`:"");
  if(ok) addXP(5);
  if(Object.keys(st.ans).length===st.qs.length){
    const score=Object.values(st.ans).filter(Boolean).length, pct=score/st.qs.length;
    const pass = pct>=0.75;
    const id = key==="exam" ? "final" : key;
    const first = pass && !S.done[id];
    let msg = `Score: ${score} / ${st.qs.length} · `;
    if(pass) msg += id==="final" ? "🎓 Herzlichen Glückwunsch! You graduated!" : "Chapter complete! 🏅 Weiter so!";
    else msg += `Almost! Practise a bit more and try again. <button class="btn alt" onclick="retry('${key}')">🔁 Retry</button>`;
    document.getElementById("score-"+key).innerHTML = msg;
    if(first){ S.done[id]=true; save(); addXP(id==="final"?100:30); confetti(); renderMenu(); }
  }
}
function retry(key){

/* ---------- Memory Book ---------- */
function mbCount(){ return MEMORY_BOOK.reduce((n,s)=>n+s.rows.length,0) + myWords().length; }

/* ---------- ✏️ My words: user-added vocabulary, sorted into your own categories ---------- */
const SUGGESTED_CATS = ["Food","Home","Work","Travel","Family","Body","Animals","Feelings","Hobbies","Weather","Verbs","Phrases"];
let myEdit = null;        // index of the word being edited, or null
let myCatFilter = "";     // category chip selected inside My words
function myWords(){ if(!Array.isArray(S.myWords)) S.myWords=[]; return S.myWords; }   // rows: [de, en, note, category]
function myCats(){ return [...new Set(myWords().map(r=>r[3]||"Other"))].sort((a,b)=>a.localeCompare(b)); }
function guessCat(de){
  if(/\|/.test(de)) return "Verbs";
  if(/^[a-zäöü]+(en|ern|eln)$/.test(de)) return "Verbs";
  if(/\s/.test(de) && !/^(der|die|das)\s\S+$/i.test(de)) return "Phrases";
  return "Other";
}
function tidyCat(c){ c=(c||"").trim(); return c ? c.charAt(0).toUpperCase()+c.slice(1) : ""; }
function myAdd(de, en, note, cat, idx){
  de=(de||"").trim(); en=(en||"").trim(); note=(note||"").trim(); cat=tidyCat(cat)||guessCat(de);
  if(!de || !en) return false;
  const list=myWords(), row=[de,en,note,cat];
  if(idx!=null && list[idx]){ list[idx]=row; return true; }
  const i=list.findIndex(r=>r[0].toLowerCase()===de.toLowerCase());
  if(i>=0) list[i]=row; else list.unshift(row);
  return true;
}
function parseLines(text, defCat){   // German = English = note = category   (note and category optional; ; or tab also work)
  let n=0;
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const p=line.split(/\s*(?:=|;|\t)\s*/).map(x=>x.trim());
    if(p.length>=2 && myAdd(p[0],p[1],p[2]||"",p[3]||defCat||"")) n++;
  });
  return n;
}
function mySave(msg){ save(); refreshMy(); renderMenu(); if(msg) toast(msg); }
function myAddForm(){
  const de=document.getElementById("my-de"), en=document.getElementById("my-en"), note=document.getElementById("my-note"), cat=document.getElementById("my-cat");
  if(!de.value.trim()||!en.value.trim()){ toast("✋ German and English are both needed"); (de.value.trim()?en:de).focus(); return; }
  const editing = myEdit!=null;
  myAdd(de.value, en.value, note.value, cat.value, myEdit);
  const keepCat = cat.value;
  de.value=en.value=note.value=""; cat.value = editing ? "" : keepCat;   // keep the category for the next word
  myCancelEdit(true);
  if(!editing) addXP(2);
  mySave(editing ? "✏️ Word updated" : "⭐ Word added!");
  de.focus();
}
function myEditStart(i){
  const r=myWords()[i]; if(!r) return;
  myEdit=i;
  document.getElementById("my-de").value=r[0]; document.getElementById("my-en").value=r[1];

function myCancelEdit(silent){

function myBulk(){

function myDelete(i){
  const r=myWords()[i]; if(!r) return;
  if(!confirm(`Delete “${strip(r[0]).replace(/\|/g,"")}” from My words?`)) return;
  myWords().splice(i,1); if(myEdit===i) myCancelEdit(); mySave("🗑️ Deleted");

function myRenameCat(cat){
  const name=tidyCat(prompt(`New name for the category “${cat}”:`, cat)); if(!name || name===cat) return;
  myWords().forEach(r=>{ if((r[3]||"Other")===cat) r[3]=name; });

function myText(){ return myWords().map(r=>[r[0],r[1],r[2]||"",r[3]||""].join(" = ").replace(/( = )+$/,"")).join("\n"); }
function myExport(){
  if(!myWords().length){ toast("No words to export yet"); return; }
  const blob=new Blob([myText()],{type:"text/plain;charset=utf-8"});

function myCopy(){

function myImport(input){

let mbCurGroup="";

/* ---------- Matching game ---------- */
let MT=null;
function newMatch(pool, cid){
  pool = pool || chapters[page].vocab; cid = cid || "tab-match";
  if(MT && MT.cid!==cid){ const old=document.getElementById(MT.cid); if(old && MT.cid.startsWith("mbm-")) old.innerHTML=""; }
  const seen=new Set(), uniq=pool.filter(r=>{ const e=strip(r[1]); if(seen.has(e)||e.length>=40) return false; seen.add(e); return true; });
  const rows=shuffle(uniq).slice(0,6);
  MT={rows, pool, cid, sel:null, left:rows.length, errors:0};
  const L=shuffle(rows.map((r,k)=>[k,strip(r[0]).replace(/\|/g,"")])), R=shuffle(rows.map((r,k)=>[k,strip(r[1])]));
  document.getElementById(cid).innerHTML = `<p style="margin-top:0">Click a German word, then its English meaning. 🧩</p>
    <div class="match"><div class="col">${L.map(([k,t])=>`<button data-side="L" data-k="${k}" onclick="pick(this)">${t}</button>`).join("")}</div>
    <div class="col">${R.map(([k,t])=>`<button data-side="R" data-k="${k}" onclick="pick(this)">${t}</button>`).join("")}</div></div>
    <p id="match-msg" class="score"></p><button class="btn alt" onclick="newMatch(MT.pool,MT.cid)">🔄 New round</button>`;
}
function pick(b){
  if(b.classList.contains("done")) return;
  if(b.dataset.side==="L"){ document.querySelectorAll('#'+MT.cid+' .match [data-side="L"]').forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); MT.sel=b; speak(sayText(MT.rows[b.dataset.k])); return; }
  if(!MT.sel){ b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); return; }
  if(MT.sel.dataset.k===b.dataset.k){
    MT.sel.classList.remove("sel"); MT.sel.classList.add("done"); b.classList.add("done"); MT.sel=null; MT.left--;
    if(MT.left===0){ const bonus = MT.errors===0?15:8; document.getElementById("match-msg").textContent = MT.errors===0?"Perfect round! 🌟":"All matched! ✅ ("+MT.errors+" mistake"+(MT.errors>1?"s":"")+")"; addXP(bonus); }
  } else { MT.errors++; b.classList.add("shake"); MT.sel.classList.add("shake"); const s=MT.sel; setTimeout(()=>{b.classList.remove("shake");s.classList.remove("shake")},400); }
}

/* ---------- Listening game ---------- */
let LS=null;
function newListen(){ LS={round:0, score:0, total:6}; listenRound(); }
function listenRound(){
  const c=chapters[page], pane=document.getElementById("tab-listen");
  if(LS.round>=LS.total){
    pane.innerHTML = `<p class="score">You got ${LS.score} / ${LS.total} by ear! ${LS.score>=5?"👂🏆 Super Ohren (super ears)!":"Keep listening! 🎧"}</p><button class="btn" onclick="newListen()">🔄 Play again</button>`;
    addXP(LS.score*2); return;
  }
  const uniq=[]; c.vocab.forEach(r=>{ if(!uniq.find(u=>strip(u[1])===strip(r[1]))) uniq.push(r); });
  const opts=shuffle(uniq).slice(0,4); LS.target=opts[Math.floor(Math.random()*opts.length)]; LS.opts=opts; LS.locked=false;
  pane.innerHTML = `<p style="margin-top:0;text-align:center">Round ${LS.round+1} / ${LS.total}: press play, listen, and pick the meaning.</p>
    <button class="listen-play" onclick="speak(sayText(LS.target))">▶</button>
    <div class="lopts">${opts.map((o,k)=>`<button onclick="lpick(${k},this)">${o[1]}</button>`).join("")}</div>
    <p id="lfb" class="feedback" style="text-align:center"></p>`;
  setTimeout(()=>speak(sayText(LS.target)),350);
}
function lpick(k,b){
  if(LS.locked) return; LS.locked=true;
  const right = LS.opts[k]===LS.target;
  const all=b.parentNode.querySelectorAll("button");
  all[LS.opts.indexOf(LS.target)].classList.add("ok"); if(!right) b.classList.add("ko");
  if(right) LS.score++;
  document.getElementById("lfb").innerHTML = (right?"✅ Richtig! ":"❌ ")+`It was <b>${strip(LS.target[0])}</b>.`;
  LS.round++; setTimeout(listenRound, 1500);
}

/* ---------- Typing practice ---------- */
let lastInput=null;
function typeHTML(items){
  return `<div class="umlauts">Special letters: ${["ä","ö","ü","ß","Ä","Ö","Ü"].map(ch=>`<button onmousedown="event.preventDefault()" onclick="insertCh('${ch}')">${ch}</button>`).join("")}</div>`
    + items.map((t,i)=>`<div class="type-row"><label>${t.p}</label><input data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" onfocus="lastInput=this" onkeydown="if(event.key==='Enter')checkType(${i})"><button class="btn" onclick="checkType(${i})">Check</button><span class="tfb" id="tfb-${i}"></span></div>`).join("")
    + `<p style="font-size:.85rem;color:var(--muted)">Tip: no German keyboard? Use the buttons above, or type <i>ss</i> for ß.</p>`;
}
function insertCh(ch){
  const inp = lastInput || document.querySelector(".type-row input"); if(!inp) return;
  const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??inp.value.length;
  inp.value = inp.value.slice(0,s)+ch+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1,s+1);
}
const norm = s => s.trim().toLowerCase().replace(/ß/g,"ss").replace(/[.!?,]+$/,"").replace(/\s+/g," ");
const TRIES = {};
function checkType(i){
  const c=chapters[page], item=c.type[i], inp=document.querySelector(`.type-row input[data-i="${i}"]`), fb=document.getElementById("tfb-"+i);
  const key=c.id+"-"+i;
  if(inp.classList.contains("ok")) return;
  if(item.a.some(a=>norm(a)===norm(inp.value))){
    inp.classList.remove("ko"); inp.classList.add("ok"); fb.innerHTML="✅ "+CHEERS[Math.floor(Math.random()*CHEERS.length)];
    speak(item.a[0]); addXP(TRIES[key]?2:4);
  } else {
    TRIES[key]=(TRIES[key]||0)+1; inp.classList.add("ko");
    fb.innerHTML = TRIES[key]===1 ? `💡 Hint: it starts with “<b>${item.a[0][0]}</b>”` : `👉 Answer: <b>${item.a[0]}</b>`;
  }
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function dashHTML(){
  const quizCh = chapters.filter(c=>c.quiz||c.final);
  const n = quizCh.filter(c=>S.done[c.id]).length;
  const lvl = levelOf(S.xp), into = S.xp - lvl*XP_PER_LEVEL, pct = lvl===LEVELS.length-1?100:Math.min(100,into/XP_PER_LEVEL*100);
  const next = chapters.findIndex(c=>(c.quiz||c.final) && !S.done[c.id]);
  const cardsTotal = allCards().length, mastered = allCards().filter(c=>(S.boxes[c.key]||0)>=3).length;
  return `<div class="kicker">Dashboard</div>
  <div class="chapter-head"><span class="emoji">🏆</span><h2>Hallo! Ready for today's German?</h2></div>
  <p class="intro">Your progress is saved in this browser. Earn XP with every right answer, collect all the badges, and keep your streak alive 🔥.</p>
  <div class="stats">
    <div class="stat"><b>${S.xp}</b><span>XP earned</span></div>
    <div class="stat"><b>${n}/${quizCh.length}</b><span>badges</span></div>
    <div class="stat"><b>🔥 ${(S.last===today()||S.last===yesterday())?S.streak:0}</b><span>day streak</span></div>
    <div class="stat"><b>${mastered}/${cardsTotal}</b><span>cards mastered</span></div>
  </div>
  <section class="block"><h3>📈 Level: ${LEVELS[lvl]}</h3>
    <div class="lvlbar"><div style="width:${pct}%"></div></div>
    <small style="color:var(--muted)">${lvl===LEVELS.length-1?"Maximum level reached. You're a Meister! 👑":`${XP_PER_LEVEL-into} XP to ${LEVELS[lvl+1]}`}</small>
    <p style="margin-bottom:0">${next>=0?`<button class="btn big" onclick="go(${next})">▶ Continue: ${chapters[next].emoji} ${chapters[next].title}</button>`:`<b>You've earned every badge. Fantastisch! 🎓</b>`}
    <button class="btn alt big" onclick="go('review')">🃏 Review deck</button>
    <button class="btn alt big" onclick="go('memory')">📒 Memory Book</button></p>
  </section>
  <section class="block"><h3>🏅 Badges</h3>
    <div class="badges">${quizCh.map(c=>`<div class="badge ${S.done[c.id]?'':'off'}" onclick="go(${chapters.indexOf(c)})"><span class="e">${c.emoji}</span>${c.title}</div>`).join("")}</div>
  </section>
  <section class="block"><h3>🗺️ Course map</h3>
    ${UNITS.map((u,k)=>{ const end = k+1<UNITS.length?UNITS[k+1].from:chapters.length; const list=chapters.slice(u.from,end);
      return `<p style="margin:6px 0"><b>${u.name}</b><br>${list.map(c=>`<a href="#" onclick="go(${chapters.indexOf(c)});return false" style="color:inherit">${c.emoji} ${c.title}</a>${S.done[c.id]?' 🏅':''}`).join(" · ")}</p>`}).join("")}
  </section>
  <p style="text-align:right"><button class="btn alt" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(KEY);location.reload()}">↺ Reset progress</button></p>`;
}

/* =========================================================
   REVIEW DECK (Leitner boxes)
   ========================================================= */
function allCards(deck){
  deck = deck || "all"; const out=[];
  if(deck!=="mb" && deck!=="my") chapters.forEach(c=>(c.cards||[]).forEach((cd,k)=>out.push({key:c.id+":"+k, f:cd[0], b:cd[1], ch:c})));
  if(deck!=="course") myWords().forEach(r=>out.push({key:"my:"+strip(r[0]), f:mbDe(r[0]), b:r[1]+(r[2]?`<div class="mb-note">${r[2]}</div>`:""), say:sayText(r), ch:{emoji:"⭐", title:"My words · "+(r[3]||"Other")}}));
  if(deck==="my") return out;
  if(deck!=="course") MEMORY_BOOK.forEach((s,i)=>s.rows.forEach(r=>out.push({key:"mb:"+strip(r[0]), f:mbDe(r[0]), b:r[1]+(r[2]?`<div class="mb-note">${r[2]}</div>`:""), say:sayText(r), ch:{emoji:"📒", title:"Memory Book · "+s.title}})));
  return out;
}
let RV=null;
function reviewHTML(){
  const d=S.deck||"all";
  return `<div class="kicker">Spaced repetition</div>
  <div class="chapter-head"><span class="emoji">🃏</span><h2>Review deck</h2></div>
  <p class="intro">Guess the meaning, flip the card, then be honest! Cards you know move up a box and come back less often; cards you miss go back to box 1. Get a card to box 4 to master it. 🧠</p>
  <section class="block">
    <div class="tabs" style="justify-content:center">
      ${[["all","🌍 Everything"],["course","📚 Course chapters"],["mb","📒 Memory Book"],["my","⭐ My words"]].map(([k,l])=>`<button class="${d===k?'on':''}" onclick="S.deck='${k}';save();RV=null;render()">${l}</button>`).join("")}
    </div>
    <div class="boxes" id="boxes"></div>
    <div class="bigcard flip" id="rcard" onclick="this.classList.toggle('on')"><div class="flip-inner"><div class="face front" id="rfront"></div><div class="face back" id="rback"></div></div></div>
    <p style="text-align:center;color:var(--muted);font-size:.88rem" id="rfrom"></p>
    <p style="text-align:center">
      <button class="btn alt big" onclick="speak(RV.say||strip(RV.f))">🔊 Listen</button>
      <button class="btn big" style="background:var(--ko)" onclick="grade(false)">🔁 Again</button>
      <button class="btn big" style="background:var(--ok)" onclick="grade(true)">✅ Got it</button></p>
  </section>`;
}
function nextReview(){
  const cards=allCards(S.deck);
  const counts=[0,0,0,0,0]; cards.forEach(c=>counts[Math.min(S.boxes[c.key]||0,4)]++);
  document.getElementById("boxes").innerHTML = ["📦 Box 1","📦 Box 2","📦 Box 3","🏆 Mastered"].map((n,k)=>`<span>${n}: <b>${k<3?counts[k]:counts[3]+counts[4]}</b></span>`).join("");
  // weighted pick: lower boxes appear more often
  const weighted=[]; cards.forEach(c=>{ const b=Math.min(S.boxes[c.key]||0,4); const w=[8,4,2,1,1][b]; for(let i=0;i<w;i++) weighted.push(c); });
  let pickC; do { pickC = weighted[Math.floor(Math.random()*weighted.length)]; } while(RV && pickC.key===RV.key && cards.length>1);
  RV=pickC;
  const card=document.getElementById("rcard"), wasOn=card.classList.contains("on");
  card.classList.remove("on");
  const fill=()=>{ const f=document.getElementById("rfront"), b=document.getElementById("rback"); if(f&&b){ f.innerHTML="<div>"+colorArt(RV.f)+"</div>"; b.innerHTML="<div>"+RV.b+"</div>"; } };
  if(wasOn) setTimeout(fill,250); else fill();
  document.getElementById("rfrom").textContent = "From: "+RV.ch.emoji+" "+RV.ch.title+" · Box "+(Math.min(S.boxes[RV.key]||0,3)+1);
}
function grade(ok){
  S.boxes[RV.key] = ok ? Math.min((S.boxes[RV.key]||0)+1,4) : 0;
  save(); if(ok) addXP(1); else touchStreak();
  nextReview();
}

/* =========================================================
   GLOBAL EVENTS + START
   ========================================================= */
document.addEventListener("click", e=>{
  const b=e.target.closest(".say"); if(!b) return;
  e.stopPropagation(); speak(b.dataset.say);
});
document.body.classList.toggle("dark", S.dark);
render();
</script>

/* Installable app: works offline once opened */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
